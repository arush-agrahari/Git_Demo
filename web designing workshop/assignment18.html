<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 18: ABC College Admission</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 15px;
        }
        main {
            padding: 20px;
            max-width: 600px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #999;
        }
        th {
            background-color: #e8eaf6;
            padding: 8px;
            font-weight: bold;
        }
        td {
            padding: 8px;
        }
        fieldset {
            border: 1px solid black;
            padding: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        select {
            width: 250px;
            padding: 4px;
        }
        textarea {
            width: 100%;
            height: 80px;
            box-sizing: border-box;
            padding: 4px;
        }
        button {
            padding: 4px 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>
    
    <main>
        <h2>Courses and Fees</h2>
        
        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="#" method="POST">
            <fieldset>
                <legend>Application Form</legend>
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course" name="course" required>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement"></textarea>
                </div>
                
                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
